# Verifica cada PR y cada push a master: lint, las verificaciones de cuentas y
# fechas, y el build completo. Un PR que rompe el build no debería poder mergearse.
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Fijo en 26.04: ubuntu-latest cambia de imagen entre el 19/10 y el 19/11
    # de 2026, y así el cambio no nos agarra en el medio. Para pasar a otra,
    # probarla en un PR (el de capturas también corre si se toca su workflow).
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build
